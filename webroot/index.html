<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<title>SING-BOX </title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fa;--card:#fff;--line:#e1e5ed;--muted:#6b7280;--text:#171923;--accent:#245bd6;--accentText:#fff;--soft:#edf2ff;--softText:#234b9d;--green:#16784b;--greenBg:#e3f7ec;--red:#b4232c;--redBg:#ffebed;--field:#f7f8fb;--log:#f7f8fb;--shadow:0 5px 22px #26344b0b}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--card:#1b1e24;--line:#30343d;--muted:#a2a8b5;--text:#f3f4f6;--accent:#dbe7ff;--accentText:#121722;--soft:#29374d;--softText:#dbe7ff;--green:#76e0a8;--greenBg:#173b2c;--red:#ff9da3;--redBg:#482328;--field:#15181e;--log:#111318;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 15px calc(22px + env(safe-area-inset-bottom));max-width:720px;margin-inline:auto}
header{padding:23px 4px 13px;display:flex;align-items:center;gap:13px}.logo{width:45px;height:45px;flex:none;display:block;object-fit:contain;border-radius:10px}h1{font-size:21px;margin:0;font-weight:760;letter-spacing:-.35px}header p{margin:3px 0 0;color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:11px 0;box-shadow:var(--shadow);animation:cardIn .38s cubic-bezier(.2,.8,.2,1) both;transition:border-color .22s,transform .22s,box-shadow .22s}.card:nth-of-type(2){animation-delay:.04s}.card:nth-of-type(3){animation-delay:.08s}.card:nth-of-type(4){animation-delay:.12s}@keyframes cardIn{from{opacity:0;transform:translateY(9px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}.statusrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.label{color:var(--muted);font-size:12px}.status{font-size:20px;font-weight:750;margin-top:2px}.pill{border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;background:var(--field);color:var(--muted);transition:background .25s,color .25s,transform .25s}.pill.on{animation:pillIn .35s ease-out}@keyframes pillIn{from{transform:scale(.88);opacity:.65}to{transform:scale(1);opacity:1}}.pill.on{background:var(--greenBg);color:var(--green)}.pill.off{background:var(--redBg);color:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{border:1px solid var(--line);border-radius:13px;min-height:46px;padding:10px 12px;font:inherit;font-weight:680;cursor:pointer;background:var(--field);color:var(--text);transition:transform .16s,filter .18s,box-shadow .18s,opacity .18s}.btn:active,.smallbtn:active,.panelLink:active{transform:scale(.975)}.btn:hover:not(:disabled),.smallbtn:hover{filter:brightness(.97)}.btn.primary{background:var(--accent);border-color:transparent;color:var(--accentText)}.btn.restart{background:var(--soft);border-color:transparent;color:var(--softText)}.btn:disabled,select:disabled{opacity:.48;cursor:not-allowed}.btn.full{grid-column:1/-1}.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.sectiontitle h2{font-size:15px;margin:0;font-weight:750}.smallbtn{border:1px solid var(--line);background:var(--field);color:var(--text);padding:7px 11px;border-radius:10px;font-size:12px;font-weight:650;white-space:nowrap;cursor:pointer;transition:transform .16s,background .18s,filter .18s}
.info{display:grid;grid-template-columns:1fr;gap:10px}.infoitem{min-width:0;background:var(--field);border-radius:13px;padding:11px 12px}.infoitem strong{display:block;font-size:13px;overflow-wrap:anywhere;margin-top:4px}.selectwrap{margin-top:7px}.selectwrap select{width:100%;min-width:0;padding:9px 28px 9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:13px}.panelLink{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:12px;border-radius:13px;background:var(--soft);color:var(--softText);text-decoration:none;font-weight:700;font-size:13px;cursor:pointer;transition:transform .2s,filter .2s}.panelLink span:last-child{font-size:18px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;background:var(--log);border:1px solid var(--line);border-radius:13px;padding:12px;margin:0;color:var(--text);font:12px/1.55 ui-monospace,SFMono-Regular,monospace;min-height:90px}.hint{color:var(--muted);font-size:11px;margin:10px 2px 0}.toast{min-height:18px;color:var(--softText);font-size:12px;margin-top:10px;overflow-wrap:anywhere;transition:opacity .2s}.rowline{display:flex;align-items:center;gap:9px}.rowline select{flex:1;min-width:0;height:38px;padding:7px 24px 7px 9px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);font:inherit;font-size:13px}.rowline .btn{min-width:0;min-height:38px;padding:7px 9px;font-size:12px;border-radius:10px;white-space:nowrap;flex:none}.spin{display:inline-block;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#panelView{opacity:0;transition:opacity .22s ease}#panelView.open{opacity:1}#panelFrame{animation:panelIn .3s cubic-bezier(.2,.8,.2,1)}@keyframes panelIn{from{opacity:.5;transform:scale(.99)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media(max-width:390px){.info{grid-template-columns:1fr}.card{padding:14px}}
</style>
</head>
<body>
<header><img class="logo" src="https://sing-box.sagernet.org/assets/icon.svg" alt="sing-box logo"><div><h1>Sing-Box <span id="versionText" style="font-size:12px;font-weight:650;color:var(--muted);letter-spacing:0">读取版本中…</span></h1><p></p></div></header>
<section class="card">
 <div class="statusrow"><div><div class="label">运行状态</div><div class="status" id="statusText">正在读取…</div></div><span class="pill" id="statusPill">检查中</span></div>
 <div class="actions" id="actions"><button class="btn primary full" id="startBtn" onclick="runAction('start')">启动</button></div>
 <div class="toast" id="toast" role="status"></div>
</section>
<section class="card">
 <div class="sectiontitle"><h2>控制面板</h2><button class="smallbtn" onclick="refreshInfo()">刷新信息</button></div>
 <div class="info">
  <div class="infoitem"><span class="label">当前配置文件</span><div class="selectwrap"><select id="configSelect" aria-label="选择配置文件" onchange="selectConfig(this.value)"><option>正在扫描…</option></select></div></div>
  <div class="infoitem"><span class="label">核心更新</span><div class="rowline" style="margin-top:7px"><select id="updateSource" aria-label="选择核心更新源"><option value="official">官方最新版（含测试版）</option><option value="mod">reF1nd Mod 版</option></select><button class="btn primary" id="updateBtn" onclick="updateCore()">检查并更新</button></div><p class="hint" style="margin-top:8px">更新完成后需重启核心才会使用新版本。</p></div>
 </div>
 <button class="panelLink" id="panelOpenBtn" onclick="showPanel()" style="width:100%;border:0;text-align:left"><span>Zashboard 面板</span><span>⛶</span></button>
 <p class="hint" id="configHint">运行中时不可切换配置；启动时直接读取 configs/ 配置文件。</p>
</section>
<section id="panelView" style="display:none;position:fixed;inset:0;z-index:1000;background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);">
 <div style="height:100%;display:flex;flex-direction:column"><div style="height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--card);border-bottom:1px solid var(--line);"><strong>Zashboard</strong><button class="smallbtn" onclick="hidePanel()">关闭</button></div><iframe id="panelFrame" title="Zashboard 面板" src="about:blank" style="display:block;border:0;width:100%;height:calc(100% - 54px);flex:1;background:var(--bg)"></iframe></div>
</section>
<section class="card"><div class="sectiontitle"><h2>运行日志</h2><button class="smallbtn" onclick="loadLog()">↻ 刷新日志</button></div><pre id="log">点击刷新日志读取最近 80 行…</pre><p class="hint">点击「刷新」更新，最多显示最近 80 行。</p><div class="sectiontitle" style="margin-top:18px"><h2>核心更新日志</h2><button class="smallbtn" onclick="loadUpdateLog()">↻ 刷新更新日志</button></div><pre id="updateLog" style="max-height:220px">尚无更新记录</pre></section>
<script type="module">
const $=id=>document.getElementById(id);let busy=false,running=false,configs=[],callSeq=0,updateBusy=false;
// 直接使用 KernelSU WebView 注入的 ksu 桥接对象，避免未打包的 bare import 导致整段脚本无法启动。
async function shell(command){
 if(!window.ksu||typeof window.ksu.exec!=='function') throw new Error('未检测到 KernelSU WebUI API（window.ksu.exec）。请从 KernelSU 管理器的模块 WebUI 入口打开，不要用普通浏览器打开。');
 return await new Promise((resolve,reject)=>{
  const cb='__singboxKsuExec_'+(++callSeq)+'_'+Date.now();
  let done=false;
  const timer=setTimeout(()=>{if(done)return;done=true;try{delete window[cb]}catch(_){};reject(new Error('Root Shell 执行超时：'+command));},30000);
  window[cb]=(errno,stdout,stderr)=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(_){};if(Number(errno)!==0)reject(new Error((stderr||stdout||'命令执行失败')+' (errno '+errno+')'));else resolve(stdout||'');};
  try{window.ksu.exec(command,null,cb);}catch(e){done=true;clearTimeout(timer);try{delete window[cb]}catch(_){};reject(new Error('调用 KernelSU Shell API 失败：'+(e&&e.message||e)));}
 });
}
function safeName(name){return /^[A-Za-z0-9._-]+\.json$/.test(name);}
const ensureDirsCommand = `mkdir -p /data/adb/Box/configs /data/adb/Box/scripts /data/adb/Box/working; [ -f /data/adb/Box/working/selected-config.txt ] || { [ ! -f /data/adb/Box/configs/config.json ] || printf '%s\n' 'config.json' > /data/adb/Box/working/selected-config.txt; }`;
function statusCommand(){return `BOX=/data/adb/Box; BIN="$BOX/sing-box"; found=0; for p in $(pidof sing-box 2>/dev/null); do [ -e "/proc/$p/exe" ] || continue; e=$(readlink "/proc/$p/exe" 2>/dev/null); case "$e" in "$BIN"|"$BIN (deleted)") echo "$p"; found=1;; esac; done; [ "$found" -eq 1 ] || echo STOPPED`;}
function updateModuleDescriptionCommand(){return `BOX=/data/adb/Box; BIN="$BOX/sing-box"; found=0; for p in $(pidof sing-box 2>/dev/null); do [ -e "/proc/$p/exe" ] || continue; e=$(readlink "/proc/$p/exe" 2>/dev/null); case "$e" in "$BIN"|"$BIN (deleted)") found=1;; esac; done; if [ "$found" -eq 1 ]; then state='运行中'; else state='已停止'; fi; MP=/data/adb/modules/singbox/module.prop; TMP="$MP.tmp"; if [ -f "$MP" ]; then awk -v d="description=Sing-Box 状态：$state" 'BEGIN{done=0} /^description=/{if(!done){print d;done=1};next} {print} END{if(!done)print d}' "$MP" > "$TMP" && cat "$TMP" > "$MP"; rm -f "$TMP"; fi`;}
function renderActions(){const root=$('actions');root.innerHTML='';if(running){root.innerHTML='<button class="btn" id="stopBtn" onclick="runAction(\'stop\')">停止</button><button class="btn restart" id="restartBtn" onclick="runAction(\'restart\')">↻ 重启</button>';}else{root.innerHTML='<button class="btn primary full" id="startBtn" onclick="runAction(\'start\')">启动</button>';}if(busy)root.querySelectorAll('button').forEach(b=>b.disabled=true);$('configSelect').disabled=running||busy;}
async function refreshStatus(){try{const out=(await shell(statusCommand())).trim();running=out!==''&&!out.includes('STOPPED');$('statusText').textContent=running?'运行中':'已停止';$('statusPill').textContent=running?'RUNNING':'STOPPED';$('statusPill').className='pill '+(running?'on':'off');renderActions();}catch(e){$('statusText').textContent='状态读取失败';$('statusPill').textContent='ERROR';$('statusPill').className='pill off';$('toast').textContent=e.message;}}
async function refreshConfigs(){const cmd=`BOX=/data/adb/Box; for f in "$BOX/configs"/*.json; do [ -f "$f" ] || continue; n=$(basename "$f"); [ "$n" = working.json ] || printf '%s\\n' "$n"; done;`;
 const names=(await shell(cmd)).split(/\r?\n/).map(s=>s.trim()).filter(safeName);configs=[...new Set(names)].sort((a,b)=>a.localeCompare(b));
 let selected='';try{selected=(await shell('cat /data/adb/Box/working/selected-config.txt 2>/dev/null')).trim();}catch{}
 if(!safeName(selected)||!configs.includes(selected)){selected=configs.includes('config.json')?'config.json':(configs[0]||'');if(selected){await shell(`printf '%s\n' '${selected}' > /data/adb/Box/working/selected-config.txt`);}}
 const sel=$('configSelect');sel.innerHTML='';if(!configs.length){sel.innerHTML='<option value="">未找到 JSON 配置</option>';sel.disabled=true;return;}
 for(const name of configs){const opt=document.createElement('option');opt.value=name;opt.textContent=name;sel.appendChild(opt);}sel.value=selected||configs[0];sel.disabled=running||busy;
}
window.refreshInfo=async()=>{try{await refreshStatus();await refreshConfigs();$('toast').textContent='控制面板信息已刷新';}catch(e){$('toast').textContent='刷新失败：'+e.message;}};
window.selectConfig=async name=>{if(running||busy){$('toast').textContent='运行中不能切换配置';return;}if(!safeName(name))return;busy=true;renderActions();$('toast').textContent='正在切换配置…';try{await shell(`/data/adb/Box/sing-box check -c '/data/adb/Box/configs/${name}' && printf '%s\n' '${name}' > /data/adb/Box/working/selected-config.txt`);$('toast').textContent='已选择 '+name+'，配置检查通过（未复制文件）';}catch(e){$('toast').textContent='切换失败：'+e.message;await refreshConfigs();}finally{busy=false;renderActions();}};
window.loadLog=async()=>{try{$('log').textContent=await shell("tail -n 80 /data/adb/Box/working/sing-box.log 2>/dev/null || echo 日志文件不存在");$('log').scrollTop=$('log').scrollHeight;}catch(e){$('log').textContent='读取日志失败：'+e.message;}};
window.loadUpdateLog=async()=>{try{$('updateLog').textContent=await shell("tail -n 80 /data/adb/Box/working/update.log 2>/dev/null || echo 尚无更新记录");$('updateLog').scrollTop=$('updateLog').scrollHeight;}catch(e){$('updateLog').textContent='读取更新日志失败：'+e.message;}};
window.updateCore=async()=>{if(updateBusy||busy)return;const source=$('updateSource').value;if(!['official','mod'].includes(source))return;updateBusy=true;const b=$('updateBtn');b.disabled=true;b.innerHTML='<span class="spin">⟳</span> 正在启动';$('toast').textContent='正在启动核心更新任务…';try{const cmd=`BOX=/data/adb/Box; UPDATER=/data/adb/Box/scripts/update.sh; [ -f "$UPDATER" ] || UPDATER=/data/adb/modules/singbox/scripts/update.sh; mkdir -p "$BOX/working"; [ -f "$UPDATER" ] || { echo UPDATER_NOT_FOUND; exit 2; }; chmod 0755 "$UPDATER" 2>/dev/null; if [ -d "$BOX/working/update.lock" ]; then echo UPDATE_ALREADY_RUNNING; else (nohup sh "$UPDATER" '${source}' >/dev/null 2>&1 </dev/null &); echo UPDATE_STARTED; fi`;const out=(await shell(cmd)).trim();if(out.includes('UPDATER_NOT_FOUND')){throw new Error('未找到 /data/adb/Box/scripts/update.sh，请确认更新脚本已放入 scripts 目录');}if(out.includes('UPDATE_ALREADY_RUNNING')){$('toast').textContent='已有核心更新任务正在运行';}else{$('toast').textContent=(source==='official'?'官方最新版（含测试版）':'reF1nd Mod 版')+' 更新任务已启动；可刷新下方更新日志查看结果。';}await loadUpdateLog();}catch(e){$('toast').textContent='启动更新失败：'+e.message;}finally{updateBusy=false;b.disabled=false;b.textContent='检查并更新';}};
async function launchDetachedStart(){
 const cmd=`BOX=/data/adb/Box; mkdir -p "$BOX/working"; SCRIPT="$BOX/scripts/start.sh"; LOG="$BOX/working/ksu-launch.log"; [ -f "$SCRIPT" ] || { echo "启动脚本不存在：$SCRIPT"; exit 2; }; if command -v setsid >/dev/null 2>&1; then setsid sh "$SCRIPT" >>"$LOG" 2>&1 </dev/null & else nohup sh "$SCRIPT" >>"$LOG" 2>&1 </dev/null & fi; echo "启动脚本已脱离 WebUI 会话，launcher_pid=$!"`;
 return await shell(cmd);
}
window.runAction=async action=>{if(busy)return;busy=true;renderActions();$('toast').textContent=action==='restart'?'正在重启…':action==='start'?'正在启动…':'正在停止…';try{let out='';if(action==='start'){await shell(ensureDirsCommand);out=await launchDetachedStart();}else if(action==='stop'){out=await shell('sh /data/adb/Box/scripts/stop.sh');}else{try{out=await shell('sh /data/adb/Box/scripts/stop.sh');}catch(e){out='停止阶段提示：'+e.message;}await new Promise(r=>setTimeout(r,800));await shell(ensureDirsCommand);out+='\n'+await launchDetachedStart();}await new Promise(r=>setTimeout(r,1800));await shell(updateModuleDescriptionCommand());await refreshStatus();$('toast').textContent=(out.trim()||'命令已执行')+'；如未运行，请查看 working/ksu-launch.log';}catch(e){$('toast').textContent='操作失败：'+e.message;await refreshStatus();}finally{busy=false;renderActions();}};
window.showPanel=()=>{const v=$('panelView');v.style.display='block';requestAnimationFrame(()=>v.classList.add('open'));document.body.style.overflow='hidden';const f=$('panelFrame');if(f.src==='about:blank')f.src='http://127.0.0.1:9090/ui';};window.hidePanel=()=>{const v=$('panelView');v.classList.remove('open');document.body.style.overflow='';setTimeout(()=>{if(!v.classList.contains('open'))v.style.display='none';},230);};
async function refreshVersion(){try{const out=await shell('/data/adb/Box/sing-box version 2>/dev/null');const m=out.match(/sing-box version\s+([^\s]+)/i);$('versionText').textContent=m?'v'+m[1]:'版本未知';}catch{$('versionText').textContent='版本未知';}}
try{await refreshVersion();await refreshStatus();await refreshConfigs();await loadUpdateLog();}catch(e){$('toast').textContent='初始化失败：'+(e&&e.message||e);console.error(e);}
</script>
</body>
</html>
